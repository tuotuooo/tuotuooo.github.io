<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Custom Cursor · 极简惯性光标</title>
<style>
  :root{
    --bg:#080d14;
    --ink:#eaf6f4;
    --muted:#7a918f;
    --teal:#56e0d0;
    --teal-soft:rgba(86,224,208,.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  /* 极简网格底纹，衬托光标 */
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(86,224,208,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(86,224,208,.045) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 8%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 45%,#000 8%,transparent 78%);
  }

  /* ---------- 自定义光标 ---------- */
  .cursor{
    position:fixed; top:0; left:0;
    pointer-events:none; z-index:9999;
    display:none; will-change:transform;
  }
  html.has-custom-cursor .cursor{ display:block; }
  html.has-custom-cursor,
  html.has-custom-cursor *{ cursor:none !important; }

  .cursor-ring{
    width:26px; height:26px; margin:-13px 0 0 -13px;
    border:1px solid var(--teal); border-radius:50%;
    opacity:.85;
    box-shadow:0 0 18px rgba(86,224,208,.18), inset 0 0 12px rgba(86,224,208,.06);
    transition:background-color .25s ease, border-color .25s ease, opacity .25s ease;
  }
  .cursor-dot{
    width:4px; height:4px; margin:-2px 0 0 -2px;
    background:var(--teal); border-radius:50%;
    box-shadow:0 0 10px rgba(86,224,208,.9);
    transition:background-color .2s ease, box-shadow .2s ease;
  }
  /* 悬停可交互元素时：环放大填充，点变白 */
  html.cursor-hover .cursor-ring{
    background:var(--teal-soft);
    border-color:var(--teal);
    opacity:1;
  }
  html.cursor-hover .cursor-dot{
    background:#fff;
    box-shadow:0 0 12px #fff;
  }

  /* ---------- 演示舞台 ---------- */
  .stage{
    position:relative; z-index:1; height:100%;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 8vw;
  }
  .kicker{
    font-size:12px; letter-spacing:.32em; color:var(--teal);
    text-transform:uppercase; margin-bottom:22px;
  }
  h1{
    font-size:clamp(56px,11vw,148px); line-height:.86;
    letter-spacing:-.04em; margin:0 0 26px; font-weight:800;
  }
  .lede{
    max-width:540px; font-size:16px; line-height:1.8;
    color:var(--muted); margin:0 0 42px;
  }
  .actions{ display:flex; gap:16px; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 28px; border:1px solid rgba(86,224,208,.35);
    color:var(--ink); text-decoration:none; font-size:14px; letter-spacing:.08em;
    background:rgba(86,224,208,.04);
    transition:border-color .3s ease, background .3s ease, transform .3s ease, box-shadow .3s ease;
  }
  .btn:hover{
    border-color:var(--teal); background:rgba(86,224,208,.14);
    transform:translateY(-3px);
  }
  .btn--primary{
    background:var(--teal); color:#04100e; border-color:var(--teal); font-weight:600;
  }
  .btn--primary:hover{
    background:#8ff0e4; box-shadow:0 10px 30px rgba(86,224,208,.25);
  }
  .hint{
    position:absolute; left:8vw; bottom:40px;
    font-size:12px; letter-spacing:.18em; color:#4a6260;
  }
  /* 触摸 / 减少动效：恢复原生光标，隐藏自定义光标 */
  @media (hover:none), (pointer:coarse){
    .cursor{ display:none !important; }
  }
</style>
</head>
<body>
  <div class="cursor cursor-ring" id="cursorRing" aria-hidden="true"></div>
  <div class="cursor cursor-dot" id="cursorDot" aria-hidden="true"></div>

  <main class="stage">
    <div class="kicker">Interaction Study / 001</div>
    <h1>CUSTOM<br>CURSOR</h1>
    <p class="lede">隐藏系统指针，用两枚圆点重建光标的存在感 —— 一枚紧贴指尖，一枚带着惯性缓缓拖随。移动、悬停、按下，感受它们的分工。</p>
    <div class="actions">
      <a href="#" class="btn btn--primary">悬停我</a>
      <a href="#" class="btn">次要按钮</a>
    </div>
    <div class="hint">MOVE · HOVER · PRESS</div>
  </main>

<script>
(function () {
  var root = document.documentElement;
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 触摸设备 / 减少动效偏好：保留原生光标，不启动自定义光标
  if (!fine || reduce) return;
  root.classList.add('has-custom-cursor');

  var dot = document.getElementById('cursorDot');
  var ring = document.getElementById('cursorRing');
  var mx = innerWidth / 2, my = innerHeight / 2;   // 鼠标目标
  var dx = mx, dy = my;                            // 小点：紧跟
  var rx = mx, ry = my;                            // 大环：惯性拖尾
  var hover = 1, hoverT = 1, press = 1;

  addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; }, { passive: true });
  addEventListener('mousedown', function () { press = 0.62; });
  addEventListener('mouseup', function () { press = 1; });
  addEventListener('blur', function () { press = 1; });

  // 悬停可交互元素：放大环 / 点亮点
  document.addEventListener('mouseover', function (e) {
    if (e.target.closest && e.target.closest('a,button,[data-cursor]')) {
      hoverT = 1.55; root.classList.add('cursor-hover');
    }
  });
  document.addEventListener('mouseout', function (e) {
    if (e.target.closest && e.target.closest('a,button,[data-cursor]')) {
      hoverT = 1; root.classList.remove('cursor-hover');
    }
  });

  // 鼠标离开 / 回到窗口：淡出 / 淡入
  document.addEventListener('mouseleave', function () {
    dot.style.opacity = 0; ring.style.opacity = 0;
  });
  document.addEventListener('mouseenter', function () {
    dot.style.opacity = ''; ring.style.opacity = '';
  });

  function loop() {
    // 小点贴手；大环追着小点走（而非各自追鼠标），保证小点不脱离环外
    dx += (mx - dx) * 0.78;   dy += (my - dy) * 0.78;
    rx += (dx - rx) * 0.28;   ry += (dy - ry) * 0.28;
    // 间距钳制：环基准半径 13px，中心距封顶 9px → 小点始终在环内
    var gx = dx - rx, gy = dy - ry;
    var gap = Math.sqrt(gx * gx + gy * gy);
    if (gap > 9) { rx = dx - gx * 9 / gap; ry = dy - gy * 9 / gap; }
    hover += (hoverT - hover) * 0.18;
    press += (1 - press) * 0.16;

    // 形变基于环相对小点的滞后方向，保留轻微惯性观感但不让小点出环
    var vx = dx - rx, vy = dy - ry;
    var dist = Math.sqrt(vx * vx + vy * vy);
    var stretch = 1 + Math.min(dist / 14, 0.3);
    var angle = dist > 0.5 ? Math.atan2(vy, vx) : 0;
    var s = hover * press;

    ring.style.transform =
      'translate3d(' + rx + 'px,' + ry + 'px,0) rotate(' + angle + 'rad) scale(' + (s * stretch) + ',' + (s / stretch) + ')';
    dot.style.transform =
      'translate3d(' + dx + 'px,' + dy + 'px,0) scale(' + (0.15 + press * 0.85) + ')';

    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
